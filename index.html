<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<title>AutoCare — автомойка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Telegram Mini App in a single light look (matches the client's mockups). Phone frame on desktop, full screen on phones.
   Screens slide horizontally; a sticky bottom bar carries the total and the main action. */
:root{
  --page:#DFE3E7; --bg:#F4F5F7; --card:#FFFFFF; --ink:#101113; --muted:#6C7179; --line:#E7E9EC; --soft:#F2F3F5;
  --black:#111214; --green:#1C9A53; --green-soft:#E2F5E9; --amber:#B86B00; --amber-soft:#FFF0DA; --red:#D2442F;
  --f:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.35;display:flex;justify-content:center;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.phone{position:relative;width:100%;max-width:440px;height:100%;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:620px) and (min-height:720px){
  body{align-items:center;padding:24px}
  .phone{height:min(900px,calc(100vh - 48px));border-radius:50px;border:11px solid #121316;box-shadow:0 30px 80px rgba(20,24,30,.25),0 0 0 1px #2a2c30}
}

/* Telegram header */
.tg{position:absolute;inset:0 0 auto 0;height:60px;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tg .ttl{text-align:center;line-height:1.1}
.tg .ttl b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.tg .ttl small{color:var(--muted);font-size:12.5px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;transition:background .2s,transform .2s var(--ease)}
.ib:active{transform:scale(.9);background:var(--soft)}
.ib svg{width:26px;height:26px}
.dots{border:2px solid var(--ink);width:36px;height:36px;justify-self:end}
.dots svg{width:20px;height:20px}
.navicon{position:relative;width:26px;height:26px}
.navicon svg{position:absolute;inset:0;transition:opacity .25s,transform .35s var(--ease)}

.stage{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:60px 16px 230px;scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}

/* Hero */
.hero{position:relative;padding:16px 0 4px;min-height:150px}
.hero .himg{position:absolute;right:-16px;top:-60px;height:330px;width:auto;max-width:56%;object-fit:cover;object-position:left top;
  -webkit-mask-image:linear-gradient(to left,#000 45%,transparent 98%),linear-gradient(to top,transparent 0,#000 35%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to left,#000 45%,transparent 98%),linear-gradient(to top,transparent 0,#000 35%);mask-composite:intersect;
  z-index:0;pointer-events:none;will-change:transform}
.hero h1{position:relative;font-size:clamp(30px,8.6vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0;text-wrap:balance}
.hero p{position:relative;margin:8px 0 0;color:var(--muted);font-size:16px;max-width:24ch}
.hero.sm{min-height:110px}
.perks{position:relative;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:14px;border-radius:18px;background:rgba(241,243,246,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.7)}
.perks .spark{width:34px;height:34px;flex:none}
.perks .lead{font-size:13.5px;color:#3b3f45;flex:1;min-width:0}
.perks ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;flex:none;font-size:12px;color:#51565d}
.perks li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.perks li svg{width:15px;height:15px;color:#8d939a;flex:none}
@media (max-width:460px){.perks .lead{flex-basis:calc(100% - 48px)}.perks ul{flex-basis:100%;flex-direction:row;flex-wrap:wrap;gap:6px 12px}}

/* Service grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.svc{position:relative;display:flex;gap:9px;align-items:flex-start;text-align:left;background:var(--card);border-radius:18px;padding:8px;border:1.5px solid transparent;box-shadow:0 1px 2px rgba(16,17,19,.04);transition:border-color .25s,box-shadow .3s,transform .25s var(--ease);min-width:0}
.svc[aria-pressed="true"]{border-color:#D5D8DC;box-shadow:0 6px 18px rgba(16,17,19,.07)}
.svc:active{transform:scale(.97)}
.thumb{width:50px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:#2a2d31;display:grid;place-items:center;color:#cfd3d8;overflow:hidden}
.thumb svg{width:30px;height:30px}
.svc .info{flex:1;min-width:0;padding:2px 18px 2px 0;display:flex;flex-direction:column;gap:3px}
.svc .info b{font-weight:600;font-size:14px;line-height:1.2;hyphens:auto;-webkit-hyphens:auto}
.svc .info span{color:var(--muted);font-size:13.5px;white-space:nowrap}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:8px;margin-top:4px;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
.tag svg{width:12px;height:12px}
.ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid #C9CDD2;display:grid;place-items:center;transition:background .25s,border-color .25s}
.ck svg{width:14px;height:14px;color:#fff;transform:scale(0);transition:transform .35s var(--spring)}
[aria-pressed="true"] > .ck{background:var(--black);border-color:var(--black)}
[aria-pressed="true"] > .ck svg{transform:scale(1)}
@media (max-width:360px){.thumb{width:42px;height:50px}.svc .info b{font-size:13px}}

/* Cards */
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 1px 2px rgba(16,17,19,.04)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ch h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.link{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13.5px;padding:4px 0;transition:color .2s}
.link:hover{color:var(--ink)}
.link svg{width:15px;height:15px}

.mini{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.mini::-webkit-scrollbar{display:none}
.mi{flex:none;display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;min-width:150px}
.mi .thumb{width:46px;height:46px;border-radius:10px}
.mi .thumb svg{width:22px;height:22px}
.mi b{display:block;font-weight:500;font-size:13.5px;line-height:1.2}
.mi span{color:var(--muted);font-size:13.5px}

/* Calendar */
.mnav{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px}
.mnav .ib{width:30px;height:30px}
.mnav .ib svg{width:18px;height:18px}
.mnav .ib[disabled]{opacity:.3;pointer-events:none}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px}
.calwrap{overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
.day{position:relative;height:52px;margin:0 auto;width:min(100%,52px);border-radius:14px;font-size:18px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .25s,color .25s,transform .25s var(--ease)}
.day i{width:4px;height:4px;border-radius:50%;background:#9aa0a7;transition:background .25s}
.day.today{background:var(--soft)}
.day[disabled]{color:#B8BCC2;cursor:default}
.day[disabled] i{visibility:hidden}
.day[aria-pressed="true"]{background:var(--black);color:#fff;transform:scale(1.04)}
.day[aria-pressed="true"] i{background:#fff}
.day:not([disabled]):active{transform:scale(.92)}

.dur{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.dur svg{width:17px;height:17px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:12px;padding:10px 2px;text-align:center;transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease)}
.slot b{display:block;font-size:17px;font-weight:600}
.slot small{display:block;color:var(--muted);font-size:12px;margin-top:2px;transition:color .25s}
.slot[disabled]{background:var(--soft);border-color:transparent;color:#B3B7BD;cursor:default}
.slot[disabled] small{color:#B3B7BD}
.slot[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}
.slot[aria-pressed="true"] small{color:#d6d8db}
.slot:not([disabled]):active{transform:scale(.94)}
@media (max-width:370px){.slots{grid-template-columns:repeat(3,1fr)}}

.addr{display:flex;gap:12px;align-items:center}
.addr img{width:96px;height:68px;border-radius:12px;object-fit:cover;flex:none}
.addr .t{flex:1;min-width:0}
.addr b{display:block;font-weight:600;font-size:15.5px}
.addr span{display:block;color:var(--muted);font-size:13.5px}
.addr a{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:13.5px;margin-top:5px;text-decoration:none}
.addr a svg{width:16px;height:16px}
.chev{width:20px;height:20px;color:var(--ink);flex:none}

/* Confirm */
.ptitle{font-size:clamp(28px,8vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:14px 0 6px;text-wrap:balance}
.psub{color:var(--muted);margin:0 0 4px;font-size:15.5px}
.carrow{display:flex;gap:12px}
.carrow{position:relative}.carrow img{width:96px;height:68px;border-radius:12px;object-fit:cover;flex:none}
.carrow .t{flex:1;min-width:0}
.carname{padding-right:70px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.carname b{font-size:19px;font-weight:700}
.plate{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:3px 8px;font-size:14px;color:#3f444a;letter-spacing:.04em;white-space:nowrap}
.loc{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:13px;color:var(--muted)}
.loc svg{width:26px;height:26px;padding:5px;border-radius:50%;background:var(--soft);color:var(--ink);flex:none}
.loc b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.meta3{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.meta3>div{display:flex;gap:8px;align-items:flex-start;padding:0 8px;min-width:0}
.meta3>div+div{border-left:1px solid var(--line)}
.meta3>div:first-child{padding-left:0}
.meta3 svg{width:30px;height:30px;padding:6px;border-radius:50%;background:var(--soft);flex:none}
.meta3 b{display:block;font-size:14px;font-weight:600}
.meta3 small{display:block;color:var(--muted);font-size:12px}
@media (max-width:440px){.meta3{grid-template-columns:1fr 1fr}.meta3>div:last-child{grid-column:1/-1;border-left:0;padding:10px 0 0;margin-top:10px;border-top:1px solid var(--line)}}
.srow{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;overflow:hidden;padding-right:12px}
.srow+.srow{margin-top:6px}
.srow .thumb{width:72px;height:46px;border-radius:0}
.srow .thumb svg{width:22px;height:22px}
.srow span{flex:1;font-weight:500;min-width:0}
.srow b{font-weight:600}

.opt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opt+.opt{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.oi{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.oi svg{width:22px;height:22px}
.opt .t{flex:1;min-width:130px}
.opt .t b{display:block;font-weight:600;font-size:15px}
.opt .t small{display:block;color:var(--muted);font-size:13px;transition:color .2s}
.promo{display:flex;gap:6px;flex:1 1 200px;min-width:0}
.promo input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);font-size:14px;outline:none;transition:border-color .2s,background .2s}
.promo input:focus{border-color:#B9BDC3;background:#fff}
.promo input.ok{border-color:var(--green);background:var(--green-soft)}
.btn-dark{background:var(--black);color:#fff;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;transition:transform .2s var(--ease),background .25s}
.btn-dark:active{transform:scale(.95)}
.btn-dark.done{background:var(--green)}
.bonus{flex:1 1 220px;display:flex;align-items:center;gap:10px;background:var(--green-soft);border-radius:14px;padding:10px 12px;transition:background .3s,opacity .3s}
.bonus[aria-pressed="false"]{background:var(--soft)}
.bonus .bi{width:24px;height:24px;color:var(--green);flex:none}
.bonus .t{min-width:0}
.bonus .t b{font-size:14px}
.sw{position:relative;width:52px;height:30px;border-radius:99px;background:#D9DCE0;flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .35s var(--spring)}
[aria-pressed="true"] > .sw,.sw.on{background:var(--green)}
[aria-pressed="true"] > .sw::after,.sw.on::after{transform:translateX(22px)}
.sw.dark.on,[aria-pressed="true"] > .sw.dark{background:var(--black)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:left;transition:border-color .25s,transform .2s var(--ease)}
.pay:active{transform:scale(.97)}
.pay[aria-pressed="true"]{border-color:var(--black)}
.pay .ck{position:static;flex:none}
.pay .pi{width:38px;height:30px;border-radius:7px;background:var(--soft);display:grid;place-items:center;flex:none}
.pay .pi svg{width:20px;height:20px}
.pay b{display:block;font-weight:600;font-size:14px}
.pay small{display:block;color:var(--muted);font-size:12.5px}
.pay .t{min-width:0}
@media (max-width:370px){.pays{grid-template-columns:1fr}}
.tg-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.tg-row+.tg-row{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.tg-row .t{flex:1;min-width:0}
.tg-row b{display:block;font-weight:600;font-size:15px}
.tg-row small{display:block;color:var(--muted);font-size:13px}
.tg-row .chev{transition:transform .3s var(--ease)}
.tg-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cmt{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.cmt.open{grid-template-rows:1fr}
.cmt>div{overflow:hidden}
.cmt textarea{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);resize:none;height:76px;outline:none}
.note{text-align:center;color:#9aa0a6;font-size:11.5px;margin-top:8px}

/* Bottom bar */
.bar{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(16,17,19,.08);padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));transition:transform .45s var(--ease)}
.bar.hide{transform:translateY(115%)}
.brow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brow .l{min-width:0;flex:1}
.brow .l b{display:block;font-size:17px;font-weight:700}
.brow .l small{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.brow .l .cap{display:block;color:var(--muted);font-size:13.5px}
.brow .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.price{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.old{color:#9AA0A6;font-size:15px;transition:opacity .3s}
.old:empty{opacity:0}
.save{font-size:12.5px;font-weight:600;background:var(--green-soft);color:var(--green);padding:4px 10px;border-radius:99px;margin-bottom:4px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;white-space:nowrap}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.a{background:var(--amber-soft);color:var(--amber)}
.cta{position:relative;width:100%;margin-top:14px;height:58px;border-radius:20px;background:var(--black);color:#fff;font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:transform .2s var(--ease),opacity .25s}
.cta svg{width:22px;height:22px;transition:transform .3s var(--ease)}
.cta:hover svg{transform:translateX(4px)}
.cta:active{transform:scale(.98)}
.cta.wait{opacity:.5}
.split{display:flex;gap:12px;align-items:center}
.split .cta{margin-top:0;flex:1.3}
.split .l{flex:1}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Success */
.done-hero{position:relative;text-align:center;padding:30px 0 6px}
.bubbles{position:absolute;inset:-60px -16px 0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;bottom:-30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(220,226,232,.6) 60%,rgba(200,208,216,.25));border:1px solid rgba(255,255,255,.9);box-shadow:inset -2px -3px 6px rgba(160,170,180,.25);animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-420px) translateX(var(--dx)) scale(1);opacity:0}}
.okc{width:96px;height:96px;margin:0 auto}
.okc circle{fill:none;stroke:var(--green);stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .7s var(--ease) .15s forwards;transform:rotate(-90deg);transform-origin:center}
.okc .bgc{fill:var(--green-soft);stroke:none;animation:none;transform:scale(0);animation:popc .5s var(--spring) forwards}
.okc path{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s var(--ease) .65s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popc{to{transform:scale(1)}}
.done-hero h2,.done-hero p{position:relative;z-index:1}.done-hero h2{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:16px 0 4px}
.done-hero p{color:var(--muted);margin:0}
.codebox{display:flex;justify-content:space-between;align-items:center}
.codebox small{color:var(--muted);display:block;font-size:13px}
.codebox b{font-size:24px;font-weight:800;letter-spacing:.04em}
.kv{display:flex;flex-direction:column;gap:9px;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.loy{position:relative;overflow:hidden;background:linear-gradient(135deg,#1A1C20,#0C0D0F 60%,#24272c);color:#fff;border-radius:22px;padding:18px;margin-top:14px}
.loy::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{transform:translate(-30px,30px)}}
.loy .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#b8bcc2}
.loy .lvl{background:rgba(255,255,255,.12);color:#fff;padding:4px 10px;border-radius:99px;font-weight:600;font-size:12px}
.loy .pts{font-size:40px;font-weight:800;letter-spacing:-.02em;margin-top:10px;line-height:1}
.loy .pts small{font-size:15px;font-weight:500;color:#b8bcc2;margin-left:6px;letter-spacing:0}
.loy .plus{display:inline-block;margin-top:8px;background:rgba(255,196,84,.16);color:#FFC454;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px}
.stamps{display:flex;gap:7px;margin-top:16px}
.stamp{flex:1;aspect-ratio:1;max-width:44px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:11px;color:#9ea3a9}
.stamp svg{width:16px;height:16px}
.stamp.on{border:0;background:#fff;color:var(--black)}
.stamp.now{border:1.5px solid #FFC454;color:#FFC454;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,196,84,.15)}}
.loy .cap{font-size:12.5px;color:#9ea3a9;margin-top:8px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btn-l{height:54px;border-radius:18px;background:var(--card);font-weight:500;font-size:16px;border:1px solid var(--line);transition:transform .2s var(--ease)}
.btn-l:active{transform:scale(.98)}
.btns .cta{margin-top:0}

/* Sheet */
.bd{position:absolute;inset:0;z-index:30;background:rgba(10,11,13,.38);opacity:0;pointer-events:none;transition:opacity .35s}
.bd.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:86%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .45s var(--ease);scrollbar-width:none}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#CDD1D6;margin:0 auto 12px}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
.bk{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:5px;margin-top:10px}
.bk .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bk .h b{font-size:16px;font-weight:700}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.up{background:var(--green-soft);color:var(--green)}
.pill.past{background:var(--soft);color:var(--muted)}
.bk .it{color:var(--muted);font-size:13.5px}
.bk .f{display:flex;justify-content:space-between;font-size:13.5px}
.fld{display:block;margin-top:14px}
.fld span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.fld input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card);font-size:16px;outline:none}
.fld input:focus{border-color:#AEB3B9}

.toast{position:absolute;left:16px;right:16px;top:70px;z-index:40;background:var(--black);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;transform:translateY(-20px);opacity:0;transition:transform .35s var(--ease),opacity .3s;pointer-events:none;text-align:center}
.toast.on{transform:none;opacity:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.in-tg #navL{visibility:hidden}.in-tg body{padding:0!important}.in-tg .phone{max-width:none;height:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}.bubbles{display:none}}
</style>
</head>
<body>

<div class="phone" id="phone">
  <header class="tg">
    <button class="ib" id="navL" aria-label="Закрыть"><span class="navicon">
      <svg id="icX" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      <svg id="icB" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0;transform:translateX(8px)"><path d="M15 4l-8 8 8 8"/></svg>
    </span></button>
    <div class="ttl"><b>AutoCare</b><small>мини-приложение</small></div>
    <button class="ib dots" id="menuBtn" aria-label="Карта и записи"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg></button>
  </header>
  <div class="stage" id="stage"></div>
  <div class="bar hide" id="bar"></div>
  <div class="bd" id="bd"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

function seats(k,t){
  const d=fromKey(k),now=new Date();
  if(key(d)===key(now)&&toMin(t)<=now.getHours()*60+now.getMinutes()+30)return 0;
  if(toMin(t)+Math.max(dur(),30)>21*60)return 0;
  return hash(k+t)%4;
}

let cur=null;
function go(name,dir=1){

  const el=document.createElement("div");el.className="screen";el.innerHTML=T[name]();

  const old=cur;cur=el;S.screen=name;
  if(old){
    if(RM)old.remove();
    else{const a=old.animate([{transform:"none",opacity:1},{transform:`translateX(${-22*dir}%)`,opacity:0}],{duration:380,easing:EASE,fill:"forwards"});a.onfinish=()=>old.remove()}
    anim(el,[{transform:`translateX(${36*dir}%)`,opacity:0},{transform:"none",opacity:1}],{duration:460});
  }
  $$(".st",el).forEach((n,i)=>anim(n,[{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:520,delay:90+Math.min(i,10)*45}));

}
function setNav(n){

  b.style.opacity=back?1:0;b.style.transform=back?"none":"translateX(8px)";

}

/* ---------- number animation ---------- */
function countTo(el,to,f=fmt){
  if(!el)return;const from=+el.dataset.v;el.dataset.v=to;
  if(RM||isNaN(from)||from===to){el.textContent=f(to);return}
  const t0=performance.now(),D=520;
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=f(Math.round(from+(to-from)*e));if(k<1&&el.dataset.v==to)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function updateBar(){
  const n=S.screen,bar=$("#bar");

    bar.classList.toggle("hide",!S.sel.size);
    if(!S.sel.size)return;
    const bN=$("#bN");bN.textContent=S.sel.size;anim(bN,[{transform:"scale(1.5)"},{transform:"none"}],{duration:350});
    $("#bNames").textContent=items().map(s=>s.n).join(", ");

  }
  if(n==="booking"){
    bar.classList.remove("hide");
    countTo($("#bP"),sub()-bundle());$("#bO").textContent=bundle()?fmt(sub()):"";
    $("#bInfo").textContent=S.sel.size+" "+pl(S.sel.size,["услуга","услуги","услуг"])+" · "+durT(dur());
    const g=$("#bGo");g.classList.toggle("wait",!S.time);g.innerHTML=S.time?`Забронировать ${I.arrow}`:"Выберите время";
  }
  if(n==="confirm"){
    bar.classList.remove("hide");
    const saved=bundle()+promoD()+bonusUse();
    countTo($("#bP"),total());$("#bO").textContent=saved?fmt(sub()):"";
    $("#cSave").textContent=saved?"Вы экономите "+fmt(saved):"Без скидок";
    $("#cEarn").textContent="+"+earn()+" бонусов после мойки";
  }
}

BIND.booking=el=>{
  $$("[data-go]",el).forEach(b=>b.onclick=()=>go(b.dataset.go,-1));
  if(!S.date||fromKey(S.date)<today0()||!dayFree(S.date)){
    let d=plusD(today0(),1);for(let i=0;i<28&&TIMES.filter(t=>seats(key(d),t)>0).length<4;i++)d=plusD(d,1);S.date=key(d);
    const mon=plusD(today0(),-((today0().getDay()+6)%7));S.off=Math.floor((d-mon)/864e5/14);
  }
  if(S.time&&!seats(S.date,S.time))S.time=null;
  drawCal(0);drawSlots(false);
  $("#prevW",el).onclick=()=>{if(S.off>0){S.off--;drawCal(-1)}};
  $("#nextW",el).onclick=()=>{if(S.off<3){S.off++;drawCal(1)}};
};
function drawCal(dir){
  const t=today0(),mon=plusD(t,-((t.getDay()+6)%7)),start=plusD(mon,S.off*14),mid=plusD(start,10);
  $("#mon",cur).textContent=MN[mid.getMonth()]+" "+mid.getFullYear();
  $("#prevW",cur).disabled=S.off===0;$("#nextW",cur).disabled=S.off===3;
  const cal=$("#cal",cur);
  cal.innerHTML=[...Array(14)].map((_,i)=>{const d=plusD(start,i),k=key(d),past=d<t,free=!past&&dayFree(k);
    return `<button class="day num ${k===key(t)?"today":""}" data-k="${k}" ${past||!free?"disabled":""} aria-pressed="${S.date===k}" aria-label="${d.getDate()} ${MG[d.getMonth()]}">${d.getDate()}<i></i></button>`}).join("");
  if(dir)anim(cal,[{transform:`translateX(${40*dir}px)`,opacity:0},{transform:"none",opacity:1}],{duration:380});
  $$(".day",cal).forEach(b=>b.onclick=()=>{
    if(S.date===b.dataset.k)return;
    $$(".day",cal).forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");
    anim(b,[{transform:"scale(.85)"},{transform:"scale(1.08)"},{transform:"scale(1.04)"}],{duration:380,fill:"none"});
    S.date=b.dataset.k;S.time=null;hap("sel");drawSlots(true);updateBar();
  });
}
function drawSlots(animate){
  const box=$("#slots",cur);
  box.innerHTML=TIMES.map(t=>{const n=seats(S.date,t),sel=S.time===t;
    return `<button class="slot" data-t="${t}" ${n?"":"disabled"} aria-pressed="${sel}"><b>${t}</b><small>${!n?"Недоступно":sel?"Выбрано":n+" "+pl(n,["место","места","мест"])}</small></button>`}).join("");
  if(animate)$$(".slot",box).forEach((s,i)=>anim(s,[{opacity:0,transform:"translateY(8px) scale(.96)"},{opacity:1,transform:"none"}],{duration:340,delay:i*30}));
  $$(".slot",box).forEach(b=>b.onclick=()=>{
    const prev=$(".slot[aria-pressed=true]",box);
    if(prev){prev.setAttribute("aria-pressed","false");const n=seats(S.date,prev.dataset.t);$("small",prev).textContent=n+" "+pl(n,["место","места","мест"])}
    b.setAttribute("aria-pressed","true");$("small",b).textContent="Выбрано";S.time=b.dataset.t;hap("sel");
    anim(b,[{transform:"scale(.9)"},{transform:"scale(1.05)"},{transform:"none"}],{duration:360});
    updateBar();
  });
}
BIND.confirm=el=>{
  $$("[data-go]",el).forEach(b=>b.onclick=()=>go(b.dataset.go,-1));
  $("#editCar",el).onclick=carSheet;
  const inp=$("#pcode",el),ap=$("#papply",el),msg=$("#pmsg",el);
  const apply=()=>{
    if(S.promo)return;
    const v=inp.value.trim().toUpperCase();
    if(v==="CLEAN10"){S.promo=true;hap("success");inp.classList.add("ok");ap.classList.add("done");ap.textContent="Готово";msg.textContent="Скидка 10% применена";msg.style.color="var(--green)";
      anim(ap,[{transform:"scale(.85)"},{transform:"scale(1.08)"},{transform:"none"}],{duration:380});refreshBonus();updateBar()}
    else{inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");hap("error");msg.textContent=v?"Промокод не найден. Попробуйте CLEAN10":"Введите промокод";msg.style.color="var(--red)"}
  };
  ap.onclick=apply;inp.onkeydown=e=>{if(e.key==="Enter")apply()};
  const bon=$("#bonus",el);bon.onclick=()=>{S.useBonus=!S.useBonus;bon.setAttribute("aria-pressed",S.useBonus);updateBar()};
  $$(".pay",el).forEach(b=>b.onclick=()=>{S.pay=b.dataset.pay;$$(".pay",el).forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $$("[data-tg]",el).forEach(b=>b.onclick=()=>{const k=b.dataset.tg;S[k]=!S[k];b.setAttribute("aria-pressed",S[k])});
  const cb=$("#cmtBtn",el),cm=$("#cmt",el),ta=$("#cmtT",el);
  cb.onclick=()=>{const o=!cm.classList.contains("open");cm.classList.toggle("open",o);cb.setAttribute("aria-expanded",o);if(o)setTimeout(()=>ta.focus({preventScroll:true}),250)};
  ta.oninput=()=>{S.comment=ta.value;$("#cmtS",el).textContent=ta.value||"Например, обратить внимание на багажник"};
};
function refreshBonus(){if(!cur)return;const t=$("#bonT",cur);if(!t)return;t.textContent="Списать "+bonusMax()+" бонусов";$("#bonS",cur).textContent="Скидка "+fmt(bonusMax())}
function submit(){
  const g=$("#bGo");if(g.dataset.busy)return;g.dataset.busy=1;g.innerHTML='<span class="spin"></span>Оплачиваем…';
  setTimeout(()=>{
    const hasWash=items().some(s=>s.wash);
    const b={code:"AC-"+(1000+hash(S.date+S.time+Date.now())%9000),date:S.date,time:S.time,items:[...S.sel],total:total(),earn:earn(),balBefore:S.balance,hasWash};
    S.balance-=bonusUse();b.balAfter=S.balance;
    S.bookings.push(b);S.last=b;
    go("success",1);hap("success");
    setTimeout(()=>countTo($("#ptsN",cur),b.balAfter,n=>n.toLocaleString("ru-RU")),900);
    bubbles();
  },1300);
}
BIND.success=el=>{
  $("#doneBtn",el).onclick=reset;
  $("#myBtn",el).onclick=menuSheet;
};
function reset(){
  if(S.last?.hasWash)S.stamps=Math.min(6,S.stamps+1);
  S.sel=new Set();S.time=null;S.promo=false;S.comment="";S.last=null;go("services",-1);
}
function bubbles(){
  if(RM)return;const box=$("#bubbles",cur);if(!box)return;
  for(let i=0;i<18;i++){const b=document.createElement("span");b.className="bubble";const s=10+Math.random()*30;
    b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;--dx:${(Math.random()-.5)*80}px;animation-duration:${2.4+Math.random()*2}s;animation-delay:${Math.random()*.8}s`;box.append(b)}
}

/* ---------- sheet ---------- */
function openSheet(html,after){
  const sh=$("#sheet");sh.innerHTML=`<div class="grab"></div>`+html;$("#bd").classList.add("on");sh.classList.add("on");sh.scrollTop=0;after?.(sh);
}
function closeSheet(){$("#bd").classList.remove("on");$("#sheet").classList.remove("on")}
$("#bd").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function menuSheet(){
  const list=[...S.bookings].sort((a,b)=>fromKey(b.date)-fromKey(a.date));
  openSheet(`<div class="loy" style="margin-top:0"><div class="top"><span>Бонусы AutoCare</span><span class="lvl">Серебро</span></div>
   <div class="pts num">${S.balance}<small>бонусов</small></div>
   <div class="stamps">${[0,1,2,3,4,5].map(i=>`<span class="stamp ${i<S.stamps?"on":""}">${i<S.stamps?I.check:i===5?I.gift:i+1}</span>`).join("")}</div>
   <div class="cap">10% возвращаем бонусами · каждая 6-я мойка кузова бесплатно</div></div>
   <h3 style="margin-top:20px">Мои записи</h3>
   ${list.map(b=>{const d=fromKey(b.date);return `<div class="bk"><div class="h"><b>${d.getDate()} ${MG[d.getMonth()]}, ${b.time}</b><span class="pill ${b.past?"past":"up"}">${b.past?"Завершено":"Предстоит"}</span></div>
    <div class="it">${b.items.map(i=>byId[i].n).join(" · ")}</div><div class="f"><span class="num">${b.code}</span><b class="num">${fmt(b.total)}</b></div></div>`}).join("")}
   <button class="btn-l" style="width:100%;margin-top:14px" id="shClose">Закрыть</button>`,sh=>{
     $("#shClose",sh).onclick=closeSheet;
     $$(".bk",sh).forEach((n,i)=>anim(n,[{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:400,delay:150+i*60}));
   });
}
$("#menuBtn").onclick=menuSheet;
function carSheet(){
  openSheet(`<h3>Автомобиль</h3>
   <label class="fld"><span>Марка и модель</span><input id="fM" value="${S.car.model}" autocomplete="off"></label>
   <label class="fld"><span>Госномер</span><input id="fP" value="${S.car.plate}" autocomplete="off"></label>
   <button class="cta" id="fSave">Сохранить</button>`,sh=>{
     $("#fSave",sh).onclick=()=>{
       S.car.model=$("#fM",sh).value.trim()||S.car.model;S.car.plate=$("#fP",sh).value.trim().toUpperCase()||S.car.plate;
       const m=$("#carM",cur),p=$("#carP",cur);if(m){m.textContent=S.car.model;p.textContent=S.car.plate;anim(m.parentElement,[{opacity:.2},{opacity:1}],{duration:400})}
       closeSheet();toast("Автомобиль обновлён");
     };
   });
}

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}

if(inTG){try{TG.BackButton.onClick(()=>$("#navL").onclick())}catch(e){}}
go("services",1);
</script>
